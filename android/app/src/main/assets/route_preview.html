<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Route Preview</title>
  <link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />
  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <style>
    html, body, #map { margin: 0; padding: 0; width: 100%; height: 100%; background: #0b1220; }
    #status {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      color: rgba(255, 255, 255, 0.85);
      font: 600 14px/1.4 system-ui, sans-serif;
      text-align: center;
      letter-spacing: 0.02em;
      background: radial-gradient(circle at center, rgba(11, 18, 32, 0.15), rgba(11, 18, 32, 0.7));
      z-index: 2;
      padding: 24px;
    }
  </style>
</head>
<body>
  <div id="map"></div>
  <div id="status">Route wird geladen...</div>
  <script>
    let map;
    let ready = false;
    let animationFrameId = null;
    const statusEl = document.getElementById('status');

    const CAMERA_CONFIG = {
      pitch: 74,
      zoom: 14.2,
      sideOffsetM: 420,
      backOffsetM: 360,
      centerSmoothing: 0.032,
      bearingSmoothing: 0.038,
      lookAheadPoints: 56,
      focusAheadPoints: 18,
      bearingWindow: 30,
      maxBearingSpeedDegPerSec: 16,
      outroPitch: 16,
      outroBearing: 0,
      outroPadding: 68,
    };

    function createSatelliteStyle() {
      return {
        version: 8,
        sources: {
          imagery: {
            type: 'raster',
            tiles: [
              'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}'
            ],
            tileSize: 256,
            attribution: 'Tiles © Esri'
          }
        },
        layers: [
          {
            id: 'imagery',
            type: 'raster',
            source: 'imagery'
          }
        ]
      };
    }

    function ensureMap(key) {
      if (map) return;
      const style = createSatelliteStyle();

      map = new maplibregl.Map({
        container: 'map',
        style,
        center: [8.2, 47.0],
        zoom: CAMERA_CONFIG.zoom,
        pitch: CAMERA_CONFIG.pitch
      });

      map.on('load', () => {
        ready = true;
        statusEl.textContent = 'Route wird angezeigt...';
        map.resize();
      });

      map.on('error', (event) => {
        if (event && event.error) {
          console.log('Map error:', event.error && event.error.message ? event.error.message : event.error);
          statusEl.textContent = 'Karte konnte nicht geladen werden.';
        }
      });
    }

    function stopRouteHeadAnimation() {
      if (animationFrameId !== null) {
        cancelAnimationFrame(animationFrameId);
        animationFrameId = null;
      }
    }

    function toRad(v) { return v * Math.PI / 180; }
    function toDeg(v) { return v * 180 / Math.PI; }

    function bearingBetween(a, b) {
      // returns bearing in degrees from north
      const lat1 = toRad(a[1]);
      const lat2 = toRad(b[1]);
      const dLon = toRad(b[0] - a[0]);
      const y = Math.sin(dLon) * Math.cos(lat2);
      const x = Math.cos(lat1) * Math.sin(lat2) - Math.sin(lat1) * Math.cos(lat2) * Math.cos(dLon);
      const br = Math.atan2(y, x);
      return (toDeg(br) + 360) % 360;
    }

    function createArrowImage() {
      try {
        const size = 64;
        const canvas = document.createElement('canvas');
        canvas.width = size;
        canvas.height = size;
        const ctx = canvas.getContext('2d');
        ctx.translate(size / 2, size / 2);
        ctx.fillStyle = '#fff36d';
        ctx.strokeStyle = '#f59e0b';
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.moveTo(0, -22);
        ctx.lineTo(10, 10);
        ctx.lineTo(0, 4);
        ctx.lineTo(-10, 10);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
        return ctx.getImageData(0, 0, size, size);
      } catch (e) {
        return null;
      }
    }

    function animateRouteHead(coords, durationSec) {
      if (!map || coords.length < 2 || !map.getSource('routeHead')) return;
      stopRouteHeadAnimation();

      if (!map.hasImage || typeof map.addImage !== 'function') {
        // fallback: keep using circle without rotation
      } else {
        if (!map.hasImage('routeArrow')) {
          const img = createArrowImage();
          if (img) map.addImage('routeArrow', img);
        }
      }

      const totalMs = Math.max(4000, Number(durationSec || 45) * 1000);
      const segmentCount = coords.length - 1;
      const startedAt = performance.now();

      // camera smoothing state
      let camLon = coords[0][0];
      let camLat = coords[0][1];
      let camBearing = 0;
      let lastNow = performance.now();

      const LOOK_AHEAD_POINTS = CAMERA_CONFIG.lookAheadPoints || Math.max(3, Math.floor(coords.length / 30));

      const tick = (now) => {
        const dt = Math.min(200, now - lastNow) / 1000;
        lastNow = now;

        const elapsed = (now - startedAt) % totalMs;
        const progress = elapsed / totalMs;
        const floatingIndex = progress * segmentCount;
        const idx = Math.floor(floatingIndex);
        const localT = floatingIndex - idx;

        const p0 = coords[idx];
        const p1 = coords[Math.min(idx + 1, segmentCount)];
        const lon = p0[0] + (p1[0] - p0[0]) * localT;
        const lat = p0[1] + (p1[1] - p0[1]) * localT;

        // compute instantaneous bearing using a small window ahead
        const br = bearingBetween(p0, p1);

        // update route head
        const feature = { type: 'Feature', properties: { bearing: br }, geometry: { type: 'Point', coordinates: [lon, lat] } };
        const source = map.getSource('routeHead');
        if (source) source.setData(feature);

        // look-ahead center
        const aheadIndex = Math.min(segmentCount, idx + LOOK_AHEAD_POINTS);
        const aheadPoint = coords[aheadIndex];
        const targetLon = lon + (aheadPoint[0] - lon) * 0.6;
        const targetLat = lat + (aheadPoint[1] - lat) * 0.6;

        // smooth camera position
        const cs = CAMERA_CONFIG.centerSmoothing || 0.032;
        camLon = camLon + (targetLon - camLon) * cs;
        camLat = camLat + (targetLat - camLat) * cs;

        // smooth bearing with rate limit
        const bs = CAMERA_CONFIG.bearingSmoothing || 0.038;
        // shortest angle delta
        const delta = ((br - camBearing + 540) % 360) - 180;
        const maxStep = (CAMERA_CONFIG.maxBearingSpeedDegPerSec || 16) * dt;
        const step = Math.max(-maxStep, Math.min(maxStep, delta * bs * 10));
        camBearing = (camBearing + step + 360) % 360;

        try {
          map.easeTo({ center: [camLon, camLat], bearing: camBearing, pitch: CAMERA_CONFIG.pitch, duration: 300 });
        } catch (e) {
          map.setCenter([camLon, camLat]);
          map.setPitch(CAMERA_CONFIG.pitch);
        }

        animationFrameId = requestAnimationFrame(tick);
      };

      animationFrameId = requestAnimationFrame(tick);
    }

    function renderRoute(routePointsJson, key, durationSec) {
      statusEl.textContent = 'Route wird geladen...';
      ensureMap(key);
      const points = JSON.parse(routePointsJson || '[]');
      const coords = points
        .map(p => [Number(p.lon), Number(p.lat)])
        .filter(c => Number.isFinite(c[0]) && Number.isFinite(c[1]));

      const run = () => {
        if (!ready) {
          setTimeout(run, 100);
          return;
        }

        if (coords.length === 0) {
          statusEl.textContent = 'Keine GPX-Route gefunden.';
          return;
        }

        const sourceData = {
          type: 'Feature',
          geometry: {
            type: 'LineString',
            coordinates: coords
          }
        };

        stopRouteHeadAnimation();
        if (map.getLayer('routeHead')) map.removeLayer('routeHead');
        if (map.getLayer('routeHeadGlow')) map.removeLayer('routeHeadGlow');
        if (map.getLayer('routeHeadIcon')) map.removeLayer('routeHeadIcon');
        if (map.getLayer('routeLine')) map.removeLayer('routeLine');
        if (map.getSource('routeHead')) map.removeSource('routeHead');
        if (map.getSource('route')) map.removeSource('route');

        map.addSource('route', { type: 'geojson', data: sourceData });
        map.addLayer({
          id: 'routeLine',
          type: 'line',
          source: 'route',
          paint: {
            'line-color': '#FBBF24',
            'line-width': 5.2,
            'line-opacity': 0.92
          }
        });

        if (coords.length > 0) {
          const head = coords[0];
          map.addSource('routeHead', {
            type: 'geojson',
            data: {
              type: 'Feature',
              properties: { bearing: 0 },
              geometry: { type: 'Point', coordinates: head }
            }
          });

          map.addLayer({
            id: 'routeHeadGlow',
            type: 'circle',
            source: 'routeHead',
            paint: {
              'circle-radius': 14,
              'circle-color': '#FBBF24',
              'circle-opacity': 0.35
            }
          });

          map.addLayer({
            id: 'routeHead',
            type: 'circle',
            source: 'routeHead',
            paint: {
              'circle-radius': 6,
              'circle-color': '#fff36d',
              'circle-stroke-width': 1,
              'circle-stroke-color': '#f59e0b'
            }
          });

          // add an arrow icon layer for oriented route head if possible
          try {
            const arrowImg = createArrowImage();
            if (arrowImg && !map.hasImage('routeArrow')) map.addImage('routeArrow', arrowImg, { pixelRatio: 1 });
            if (map.hasImage('routeArrow')) {
              map.addLayer({
                id: 'routeHeadIcon',
                type: 'symbol',
                source: 'routeHead',
                layout: {
                  'icon-image': 'routeArrow',
                  'icon-allow-overlap': true,
                  'icon-rotate': ['get', 'bearing'],
                  'icon-size': 0.6
                }
              });
            }
          } catch (e) {
            // ignore if symbols/images are not supported
          }
        }

        if (coords.length > 1) {
          const bounds = coords.reduce((b, c) => b.extend(c), new maplibregl.LngLatBounds(coords[0], coords[0]));
          map.fitBounds(bounds, { padding: 80, maxZoom: 15, duration: 0 });
          map.resize();
          map.easeTo({ pitch: CAMERA_CONFIG.pitch, duration: 0 });
          animateRouteHead(coords, durationSec);
          statusEl.style.display = 'none';
        }
      };

      run();
    }

    window.renderRoute = renderRoute;
  </script>
</body>
</html>
