<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Route Preview</title>
  <link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />
  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <style>
    html, body, #map { margin: 0; padding: 0; width: 100%; height: 100%; background: #0b1220; }
  </style>
</head>
<body>
  <div id="map"></div>
  <script>
    let map;
    let ready = false;

    const CAMERA_CONFIG = {
      pitch: 74,
      zoom: 14.2
    };

    function ensureMap(key) {
      if (map) return;
      const style = key
        ? `https://api.maptiler.com/maps/satellite/style.json?key=${key}`
        : 'https://demotiles.maplibre.org/style.json';

      map = new maplibregl.Map({
        container: 'map',
        style,
        center: [8.2, 47.0],
        zoom: CAMERA_CONFIG.zoom,
        pitch: CAMERA_CONFIG.pitch
      });

      map.on('load', () => {
        ready = true;
      });
    }

    function renderRoute(routePointsJson, key) {
      ensureMap(key);
      const points = JSON.parse(routePointsJson || '[]');
      const coords = points
        .map(p => [Number(p.lon), Number(p.lat)])
        .filter(c => Number.isFinite(c[0]) && Number.isFinite(c[1]));

      const run = () => {
        if (!ready) {
          setTimeout(run, 100);
          return;
        }

        const sourceData = {
          type: 'Feature',
          geometry: {
            type: 'LineString',
            coordinates: coords
          }
        };

        if (map.getLayer('routeHead')) map.removeLayer('routeHead');
        if (map.getLayer('routeHeadGlow')) map.removeLayer('routeHeadGlow');
        if (map.getLayer('routeLine')) map.removeLayer('routeLine');
        if (map.getSource('routeHead')) map.removeSource('routeHead');
        if (map.getSource('route')) map.removeSource('route');

        map.addSource('route', { type: 'geojson', data: sourceData });
        map.addLayer({
          id: 'routeLine',
          type: 'line',
          source: 'route',
          paint: {
            'line-color': '#FBBF24',
            'line-width': 5.2,
            'line-opacity': 0.92
          }
        });

        if (coords.length > 0) {
          const head = coords[0];
          map.addSource('routeHead', {
            type: 'geojson',
            data: {
              type: 'Feature',
              geometry: { type: 'Point', coordinates: head }
            }
          });

          map.addLayer({
            id: 'routeHeadGlow',
            type: 'circle',
            source: 'routeHead',
            paint: {
              'circle-radius': 14,
              'circle-color': '#FBBF24',
              'circle-opacity': 0.35
            }
          });

          map.addLayer({
            id: 'routeHead',
            type: 'circle',
            source: 'routeHead',
            paint: {
              'circle-radius': 6,
              'circle-color': '#fff36d',
              'circle-stroke-width': 1,
              'circle-stroke-color': '#f59e0b'
            }
          });
        }

        if (coords.length > 1) {
          const bounds = coords.reduce((b, c) => b.extend(c), new maplibregl.LngLatBounds(coords[0], coords[0]));
          map.fitBounds(bounds, { padding: 80, maxZoom: 15, duration: 0 });
          map.easeTo({ pitch: CAMERA_CONFIG.pitch, duration: 0 });
        }
      };

      run();
    }

    window.renderRoute = renderRoute;
  </script>
</body>
</html>
