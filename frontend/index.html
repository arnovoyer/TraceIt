<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TraceIt</title>
    <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="toolbar">
        <h1>TraceIt</h1>
        <label class="file-input-label" for="gpxInput">GPX hochladen</label>
        <input id="gpxInput" type="file" accept=".gpx" />

        <label for="durationInput">Dauer (Sek.)</label>
        <input id="durationInput" type="number" min="5" max="300" value="40" />

        <label for="formatSelect">Format</label>
        <select id="formatSelect">
          <option value="landscape" selected>16:9</option>
          <option value="portrait">9:16</option>
        </select>

        <label class="file-input-label" for="photoInput">Bild-Spot</label>
        <input id="photoInput" type="file" accept="image/*" />

        <button id="playButton" disabled>Animation starten</button>
        <button id="recordButton" disabled>Animation aufnehmen & herunterladen</button>
      </header>

      <section class="status-row">
        <p id="statusText">Warte auf GPX-Datei ...</p>
      </section>

      <section id="mapStage">
        <div id="mapFrame" class="landscape">
          <aside id="insightPanel" class="insight-panel hidden" aria-live="polite">
            <div id="maxSpeedRow" class="insight-row muted">
              <span class="insight-icon" aria-hidden="true">⚡</span>
              <span class="insight-label">Max. Speed</span>
              <strong id="maxSpeedValue">-</strong>
            </div>
            <div id="maxElevationRow" class="insight-row muted">
              <span class="insight-icon" aria-hidden="true">⛰</span>
              <span class="insight-label">Hoechster Punkt</span>
              <strong id="maxElevationValue">-</strong>
            </div>
            <div id="photoRow" class="insight-row hidden-row">
              <span class="insight-icon" aria-hidden="true">📷</span>
              <span class="insight-label">Foto-Spots</span>
              <strong id="photoSpotCount">0</strong>
            </div>
            <p id="insightEvent" class="insight-event hidden"></p>
          </aside>

          <div id="altitudeOverlay" class="altitude-overlay hidden" aria-label="Hoehenprofil">
            <svg id="altitudeSvg" viewBox="0 0 320 96" preserveAspectRatio="none">
              <defs>
                <clipPath id="altitudeProgressClip">
                  <rect id="altitudeClipRect" x="0" y="0" width="0" height="96"></rect>
                </clipPath>
                <linearGradient id="altitudeGradient" x1="0%" y1="0%" x2="0%" y2="100%">
                  <stop offset="0%" style="stop-color:#FBBF24;stop-opacity:0.6" />
                  <stop offset="100%" style="stop-color:#F59E0B;stop-opacity:0.2" />
                </linearGradient>
                <linearGradient id="altitudeLineGradient" x1="0%" y1="0%" x2="100%" y2="0%">
                  <stop offset="0%" style="stop-color:#FCD34D;stop-opacity:1" />
                  <stop offset="100%" style="stop-color:#FBBF24;stop-opacity:1" />
                </linearGradient>
              </defs>
              <path id="altitudeAreaBg" d=""></path>
              <path id="altitudeAreaDone" d="" clip-path="url(#altitudeProgressClip)"></path>
              <path id="altitudeLineBg" d=""></path>
              <path id="altitudeLineDone" d="" clip-path="url(#altitudeProgressClip)"></path>
            </svg>
          </div>
          <section id="map"></section>
        </div>
      </section>
    </main>

    <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
    <script src="./config.local.js"></script>
    <script type="module" src="./main.js"></script>
  </body>
</html>
